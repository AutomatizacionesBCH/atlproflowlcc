name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  check:
    # Compuerta: si el código no compila o no pasa el lint, no se despliega.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  deploy:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: Disparar deploy en EasyPanel
        run: |
          curl -X POST "${{ secrets.EASYPANEL_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{}' \
            --fail
